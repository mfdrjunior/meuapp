name: Gerar APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    - run: npm install && npx cap add android && npx cap sync android
    - run: sed -i 's/<application/<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/><uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" \/><uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/><uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" \/><application/' android/app/src/main/AndroidManifest.xml
    - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: Folha-QRU-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
