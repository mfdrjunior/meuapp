name: Gerar APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Capacitor e Plugins
        run: npm install

      - name: Criar plataforma Android
        run: npx cap add android

      - name: Preparar e gerar ícones oficiais do APK
        run: |
          mkdir -p resources
          cp www/fundo.png resources/icon.png
          cp www/fundo.png resources/splash.png
          npm install @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --splashBackgroundColor '#0f172a'

      - name: Configurar permissões de GPS, Rede, Arquivos e Câmera no AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.CAMERA" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" \/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>\n    <application/' $MANIFEST

      - name: Sincronizar arquivos web
        run: npx cap sync android

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v5
        with:
          name: Folha-de-QRU-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
